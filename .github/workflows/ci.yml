name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} • Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bytecode syntax verification
        run: python -m py_compile daemon/qr_banner.py daemon/pty_engine.py daemon/server.py tests/test_daemon.py

      - name: Verify POSIX launcher scripts (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n start.sh
          bash -n run_daemon.sh
          ./start.sh --help >/dev/null

      - name: Verify PowerShell launcher AST & CLI help (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/start.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            Write-Error ("PowerShell syntax errors in start.ps1: " + ($errors | Out-String))
            exit 1
          }
          & .\start.ps1 --help | Out-Null

      - name: Run 18-test daemon, WebSocket CSWSH, Multi-PTY, QR, OPSEC & AppSec suite
        env:
          MITH_NO_AUTO_CLOUDFLARED: "1"
          PYTHONUTF8: "1"
        run: python -m unittest discover -v -s tests
